[package]
name = "phoebe"
version = "0.5.0"
edition = "2024"
description = "Observability for a Nix fleet: every machine and service, their metrics, logs and alerts"
license = "MIT"
repository = "https://github.com/GustavoWidman/phoebe"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
env_logger = "0.11.11"
eyre = "0.6.12"
futures-util = "0.3.34"
getrandom = "0.4.3"
gjallar = { version = "0.1.0", features = ["client"] }
hmac = "0.13.0"
jiff = "1.0.3"
log = "0.4.33"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rustix = { version = "1.1.6", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
